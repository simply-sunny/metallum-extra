org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric / Minecraft (match Metallum's own build)
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.16-SNAPSHOT

# The Metallum releases on Modrinth this build hooks into: metallum_version up to metallum_max_version.
# Metallum Extra patches Metallum internals, so it only accepts releases it has been checked against.
# It is compiled against metallum_version, the OLDEST one, so the code cannot come to rely on something only a
# newer release has.
# To add a new Metallum release: raise metallum_max_version, launch with -Pmetallum_run_version=<it>, and fix any
# mixin that fails (see "Updating" in docs/details.md).
metallum_version=0.0.25
metallum_max_version=0.0.25
# The Metal bindings Metallum is built on (it bundles them); compiled against for the typed Metal classes.
metal_jvm_version=0.1.0
modmenu_version=21.0.0
sodium_version=mc26.3-0.9.3-alpha.1-fabric
fabric_api_version=0.162.0+26.3
distant_horizons_version=3.3.4-26.3
# Voxy's 26.3 test build (Cortex's #testing build, commit 23b3486). Local jar: compile-only for the
# Metal far-terrain bridge and on the dev client's classpath; never bundled or published.
voxy_jar=libs/voxy-0.2.20-beta-23b3486.jar

# Mod
mod_version=0.2.0
maven_group=com.metallumextra
