# Metallically Beautiful: the mod's own shader pack, in the Iris layout.

# The pack reads this mod's own kind of block (water, lava, leaves, plants, shiny things, glowing things) as mc_Entity.x; that is not an id from block.properties.
mx.blockTypes=true

program.shadow.enabled=SHADOWS
program.composite.enabled=AMBIENT_OCCLUSION || SUN_RAYS
program.composite1.enabled=AMBIENT_OCCLUSION || SUN_RAYS
program.composite2.enabled=AMBIENT_OCCLUSION || SUN_RAYS
program.composite3.enabled=BLOOM
program.composite4.enabled=BLOOM
program.composite5.enabled=BLOOM
program.composite6.enabled=BLOOM
program.composite7.enabled=BLOOM
program.composite8.enabled=BLOOM
program.composite9.enabled=BLOOM
program.composite10.enabled=BLOOM
program.composite11.enabled=BLOOM
program.composite12.enabled=BLOOM

size.buffer.colortex4=0.5 0.5
size.buffer.colortex5=0.5 0.5
size.buffer.colortex6=0.5 0.5
size.buffer.colortex7=0.25 0.25
size.buffer.colortex8=0.125 0.125
size.buffer.colortex9=0.0625 0.0625
size.buffer.colortex10=0.03125 0.03125
