plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+metallum.${project.metallum_version}-${project.metallum_max_version}"
group = project.maven_group

base {
	archivesName = 'metallum-extra'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Metallum itself (from Modrinth). Needed at compile time because we hook its internals,
	// and at runtime so `./gradlew runClient` launches with Metal.
	// The dev client runs the oldest supported release unless told otherwise: -Pmetallum_run_version=<version>
	compileOnly "maven.modrinth:metallum-mc:${project.metallum_version}"
	compileOnly "io.github.kokodio:metal-jvm:${project.metal_jvm_version}"

	def withIris = project.hasProperty('withIris')
	if (withIris) {
		runtimeOnly "maven.modrinth:iris:1.11.7+26.3-fabric"
	} else {
		runtimeOnly "maven.modrinth:metallum-mc:${project.findProperty('metallum_run_version') ?: project.metallum_version}"
	}

	// Optional: only for the in-game settings screen entry in Mod Menu. Not needed at runtime.
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	// Dev client only: run with Sodium (and the Fabric API it needs), since one fix targets Sodium and that is how
	// Metallum is normally used. Not bundled and not required.
	// Sodium is also compiled against for its video-settings API (the page is only loaded when Sodium is present).
	implementation "maven.modrinth:sodium:${project.sodium_version}"
	runtimeOnly "maven.modrinth:fabric-api:${project.fabric_api_version}"
}

loom {
	runs {
		client {
			client()
			name "Minecraft Client (Metal)"
			runDir "run"
		}
		clientIris {
			client()
			name "Minecraft Client (Iris OpenGL)"
			runDir "run-iris"
			vmArg "-Dmetallumextra.disabled=true"
		}
	}
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'metallum_version', project.metallum_version
	inputs.property 'metallum_max_version', project.metallum_max_version

	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version, 'metallum_version': inputs.properties.metallum_version,
				'metallum_max_version': inputs.properties.metallum_max_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
