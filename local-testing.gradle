// Checks of shader pack loading and the translation cache that need no game. Runs with `check` (and so `build`).
tasks.register('packTest', JavaExec) {
	group = 'verification'
	description = 'Checks shader pack loading, validation and the translation cache.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.PackTests'
	workingDir = projectDir
}
tasks.named('check') { dependsOn 'packTest' }

// `gradlew packCheck -Pzip=<file>`: plans every dimension of a shader pack ZIP and says what blocks it (no game needed).
tasks.register('packCheck', JavaExec) {
	group = 'verification'
	description = 'Plans a shader pack ZIP for every dimension and reports what blocks it.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.PackCheck'
	systemProperty 'metallumextra.packOptionsFile', "${buildDir}/packcheck-options.properties"
	workingDir = projectDir
	args = [project.findProperty('zip') ?: 'run/shaderpacks/ComplementaryReimagined_r5.5.1.zip'] + (project.hasProperty('profile') ? ['profile', project.property('profile')] : []) + (project.hasProperty('dump') ? ['dump', project.property('dump')] + (project.hasProperty('strip') ? ['strip'] : []) : [])
}

// `gradlew compileCheck -Pzip=<file> [-Pprofile=POTATO] [-Pdimension=world0] [-Pdump=<folder>]`: plans a pack, fits its programs to the game's pipelines and compiles them.
tasks.register('compileCheck', JavaExec) {
	group = 'verification'
	description = 'Compiles every program of a shader pack ZIP the way the game would, and reports the failures.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.ShaderCompileCheck'
	workingDir = projectDir
	systemProperty 'metallumextra.packOptionsFile', "${buildDir}/packcheck-options.properties"
	args = [project.findProperty('zip') ?: 'run/shaderpacks/ComplementaryReimagined_r5.5.1.zip', project.findProperty('dimension') ?: 'world0'] + (project.hasProperty('dump') ? [project.property('dump')] : [])
}

// `gradlew compileCheckAll -Pfolder=<folder>`: compileCheck for every ZIP of a folder in one JVM, one `<file>|<result>` line each.
tasks.register('compileCheckAll', JavaExec) {
	group = 'verification'
	description = 'Compiles every program of every shader pack ZIP in a folder.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.ShaderCompileCheck'
	workingDir = projectDir
	systemProperty 'metallumextra.packOptionsFile', "${buildDir}/packcheck-options.properties"
	args = ['--all', project.findProperty('folder') ?: 'run/shaderpacks']
}

// `gradlew writeTestPacks -Pto=<folder>` writes RedToBlue.zip and BlueToRed.zip, for trying packs by hand.
tasks.register('writeTestPacks', JavaExec) {
	group = 'verification'
	description = 'Writes the RedToBlue and BlueToRed test packs into the folder given with -Pto.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.TestPacks'
	workingDir = projectDir
	args = [project.findProperty('to') ?: 'run/shaderpacks']
}

// `gradlew checkIris -Pfolder=<folder>`: checks the log and pictures of a run of src/test/iris-pipeline/run.sh.
tasks.register('checkIris', JavaExec) {
	group = 'verification'
	description = 'Checks what the multi-pass pipeline test packs drew.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.PackTests'
	workingDir = projectDir
	args = ['iris', project.findProperty('folder') ?: 'run/iris-pipeline']
}

// `gradlew compareScenes -Pa=<folder> -Pb=<folder>`: compares the pictures of two runs of src/test/baseline/run.sh.
tasks.register('compareScenes', JavaExec) {
	group = 'verification'
	description = 'Compares the pictures of two baseline runs.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.PackTests'
	workingDir = projectDir
	args = ['compare', project.findProperty('a') ?: 'run/baseline-1', project.findProperty('b') ?: 'run/baseline-2',
			project.findProperty('mean') ?: '0.5', project.findProperty('pct') ?: '1.0']
}

// `gradlew checkPackImages -Pfolder=<folder>`: checks the pictures a run of src/test/pack-regression/packs.txt saved.
tasks.register('checkPackImages', JavaExec) {
	group = 'verification'
	description = 'Checks the colors in the pictures saved by the pack regression script.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.PackTests'
	workingDir = projectDir
	args = ['images', project.findProperty('folder') ?: 'run/pack-regression']
}

// The checks are plain programs (packTest), not JUnit, so Gradle's own test task has nothing to run.
tasks.named('test') { enabled = false }

// `gradlew adaptBench -Pzip=<file> -Pprogram=world0/gbuffers_terrain.vsh`: times what the game does to one program before compiling it.
tasks.register('adaptBench', JavaExec) {
	group = 'verification'
	description = 'Times and samples the adaptation of one program of a shader pack.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.AdaptBench'
	workingDir = projectDir
	systemProperty 'metallumextra.packOptionsFile', "${buildDir}/packcheck-options.properties"
	args = [project.findProperty('zip') ?: 'run/shaderpacks/ComplementaryReimagined_r5.5.1.zip', project.findProperty('program') ?: 'world0/gbuffers_terrain.vsh']
}

tasks.register('metalFxProbe', JavaExec) {
	group = 'verification'
	description = 'Checks that MetalFX can be reached from Java here.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.MetalFxProbe'
	jvmArgs = ['--enable-native-access=ALL-UNNAMED']
	workingDir = projectDir
}

tasks.register('imageMslSpike', JavaExec) {
	group = 'verification'
	description = 'Shows the Metal source SPIRV-Cross makes of storage images, SSBOs and atomics in a raster stage.'
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'com.metallumextra.ImageMslSpike'
	workingDir = projectDir
}
